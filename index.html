<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salmaan Barday</title>
<style>
  :root { --bg: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --rule: #e1e0d9; --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --ink: #f0efec; --ink2: #c3c2b7; --rule: #2c2c2a; --accent: #5598e7; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 56px 20px; }
  h1 { font-size: 28px; margin: 0 0 6px; }
  .sub { color: var(--ink2); margin: 0 0 36px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); font-weight: 600;
       border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .post { margin: 18px 0; }
  .post a { font-size: 19px; font-weight: 600; }
  .post div { color: var(--ink2); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Salmaan Barday</h1>
  <p class="sub">Notes on AI safety and machine learning.</p>
  <h2>Posts</h2>
  <div class="post">
    <a href="blog/llm-written-models/">An LLM wrote a model worth 3,500 labelled rows</a>
    <div>November 2026 · On data newer than its training, Claude's written models beat TabPFN up to 256 rows, but couldn't learn from a few more.</div>
  </div>
</main>
</body>
</html>
